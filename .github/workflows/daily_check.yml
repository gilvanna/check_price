name: Daily Cana Brava Price Check

on:
  schedule:
    - cron: '0 11 * * *' # Runs daily at 08:00 Brasília time (11:00 UTC)
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore price history
        uses: actions/cache@v4
        with:
          path: cana_brava_history.json
          key: price-history-${{ github.run_id }}
          restore-keys: price-history-

      - name: Run price monitor
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: npm start